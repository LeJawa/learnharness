services:
  learnharness:
    build: .
    container_name: learnharness
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${LH_PORT:-3000}:3000"
    volumes:
      # Persistent storage: chat sessions, graph ledgers, settings, model cache
      - learnharness-data:/app/data
    environment:
      - NODE_ENV=production
      - LH_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  learnharness-data:
