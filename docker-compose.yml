services:
  learnharness:
    build: .
    container_name: learnharness
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${LH_PORT:-5000}:3000"
    volumes:
      # Persistent storage: chat sessions, graph ledgers, settings, model cache
      - learnharness-data:/app/data
    environment:
      - NODE_ENV=production
      - LH_DATA_DIR=/app/data
      # Keep the key store AND the subscription credential files (their
      # directory is derived from this file's dirname) inside the writable,
      # persisted volume. Pointing this at the image root instead makes the
      # chatgpt/subscription stores fail on every write and the client then
      # loops on /api/models + /api/subscriptions indefinitely.
      - LH_AUTH_FILE=/app/data/auth.json
    healthcheck:
      # node:*-slim ships neither wget nor curl — probe with the runtime itself.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  learnharness-data:
